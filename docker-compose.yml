services:
  app:
    build: .
    ports:
      - "3002:3002"
    container_name: tunet-dashboard
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - IOS_CACHE_RECOVERY=1
      - APP_BUILD_ID=2026-05-25-ios-cache-recovery
      - DATA_DIR=/app/data
      - HA_BACKUP_ROOT=/app/ha-backups
      - NETWORK_WG_CONFIG_PATH=/app/runtime/wireguard/wg0.conf
      - NETWORK_CADDY_CONFIG_PATH=/app/runtime/caddy/Caddyfile
      - NETWORK_DOMAIN_SUFFIX=smarti.dev
      - NETWORK_SERVER_PUBLIC_HOST=65.21.203.69
      - NETWORK_WG_SERVER_PUBLIC_KEY=lrOUZtZzokAzBtsGorxA7/jgK7ROnIaemE4Y0VCbAgA=
      - NETWORK_WG_LISTEN_PORT=51820
      - NETWORK_WG_SYNC_STATUS_PATH=/app/runtime/status/wireguard.json
      - NETWORK_CADDY_SYNC_STATUS_PATH=/app/runtime/status/caddy.json
      - UNIFI_MOBILITY_API_KEY=${UNIFI_MOBILITY_API_KEY:-}
      - UNIFY_API_KEY=${UNIFY_API_KEY:-}
      - UNIFI_MOBILITY_API_URL=${UNIFI_MOBILITY_API_URL:-https://api.ui.com/v1/mobility}
      - UNIFI_MOBILITY_CACHE_TTL_MS=${UNIFI_MOBILITY_CACHE_TTL_MS:-60000}
      - APP_PUBLIC_URL=${APP_PUBLIC_URL:-}
      - SMTP_URL=${SMTP_URL:-}
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_SECURE=${SMTP_SECURE:-false}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - SMTP_FROM=${SMTP_FROM:-}
      - SMTP_REPLY_TO=${SMTP_REPLY_TO:-}
      - USER_INVITATION_TTL_HOURS=${USER_INVITATION_TTL_HOURS:-72}
    volumes:
      - tunet-data:/app/data
      - /srv/ha-backups:/app/ha-backups
      - /etc/wireguard:/app/runtime/wireguard
      - /etc/caddy:/app/runtime/caddy
      - /var/lib/smarti-network-runtime:/app/runtime/status:ro
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:3002/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s

volumes:
  tunet-data:
